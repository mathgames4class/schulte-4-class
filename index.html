<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таблиця Шульте — 4 варіанти</title><style>body{margin:0;background:#f5f3ef;color:#28343b;font-family:Arial,"Noto Sans",sans-serif}main{max-width:750px;margin:auto;padding:20px 14px 36px;text-align:center}h1{font-size:clamp(23px,5vw,32px)}p{line-height:1.5}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.nav a,.action{border:1px solid #b8c5c4;border-radius:12px;background:#fff;padding:10px 14px;color:#28343b;text-decoration:none;font-weight:700;font-size:16px;cursor:pointer}.nav .selected{background:#d6e4e0;border-color:#6c9c91}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px auto;max-width:580px}.stat{background:#fff;border-radius:12px;padding:12px 4px;border:1px solid #deded8}.stat small{display:block;font-size:12px}.stat strong{font-size:clamp(18px,5vw,27px)}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-width:610px;margin:18px auto}.cell{border:0;background:transparent;aspect-ratio:1/1;padding:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.shape{display:flex;align-items:center;justify-content:center;width:96%;height:96%;font-size:clamp(13px,3.8vw,25px);font-weight:800;color:#273238}.circle{border-radius:50%}.square{border-radius:12px}.diamond{width:73%;height:73%;transform:rotate(45deg);border-radius:8px}.diamond span{transform:rotate(-45deg)}.hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}.oval{height:76%;border-radius:50%}.done .shape{opacity:.25}.done:after{content:'✓';position:absolute;color:#23754d;font-size:25px;font-weight:900}.wrong .shape{outline:3px solid #c96565;outline-offset:2px}.hint .shape{filter:drop-shadow(0 0 7px #c28c20)}#status{min-height:24px;font-weight:bold}footer{font-size:13px;color:#536268;margin-top:20px}@media(max-width:380px){.board{gap:3px}.shape{font-size:13px}}</style></head><body><main><h1>Таблиця Шульте — 4 варіанти</h1><p>Знайди числа від <b>1000 до 1025</b> у порядку зростання. Обери один із чотирьох варіантів.</p><nav class="nav" aria-label="Вибір варіанта"><button type="button" class="action selected" data-choice="1">Варіант 1</button><button type="button" class="action" data-choice="2">Варіант 2</button><button type="button" class="action" data-choice="3">Варіант 3</button><button type="button" class="action" data-choice="4">Варіант 4</button></nav><section class="stats"><div class="stat"><small>Наступне число</small><strong id="target">1000</strong></div><div class="stat"><small>Знайдено</small><strong id="progress">0 / 26</strong></div><div class="stat"><small>Час</small><strong id="clock">00:00</strong></div></section><div id="status" aria-live="polite"></div><div id="board" class="board"></div><button class="action" id="restart">↻ Нова спроба</button> <button class="action" id="hint">Підказка</button><footer>Натискай числа послідовно. Таймер починається після першого правильного натискання.</footer></main><script>let variant=1;const colors=['#D9B9B5','#B9CDBB','#B9CBDA','#E2D0A9','#CCBFDC','#D8C5AF','#B6D1CE','#D5C3C8'];const shapes=['circle','square','diamond','hex','oval'];let next=1000,elapsed=0,startAt=0,timer=null;const $=id=>document.getElementById(id);function shuffled(seed){let a=Array.from({length:26},(_,i)=>1000+i),s=seed*73471+821;for(let i=a.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;let j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function clock(){let s=Math.floor(elapsed/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function stop(){if(timer){clearInterval(timer);timer=null;elapsed=Date.now()-startAt}clock()}function reset(){stop();elapsed=0;next=1000;$('target').textContent='1000';$('progress').textContent='0 / 26';$('status').textContent='Знайди число 1000, щоб почати!';clock();draw()}function draw(){let board=$('board');board.innerHTML='';shuffled(variant).forEach((n,i)=>{let b=document.createElement('button');b.type='button';b.className='cell';b.dataset.n=n;b.setAttribute('aria-label','Число '+n);let sh=document.createElement('div');sh.className='shape '+shapes[(i*3+variant*2+n)%shapes.length];sh.style.background=colors[(i*5+variant*3+n)%colors.length];let sp=document.createElement('span');sp.textContent=n;sh.appendChild(sp);b.appendChild(sh);b.onclick=()=>choose(b,n);board.appendChild(b)})}function choose(b,n){if(b.classList.contains('done')||next>1025)return;if(n!==next){b.classList.add('wrong');$('status').textContent='Спробуй ще! Шукай число '+next+'.';setTimeout(()=>b.classList.remove('wrong'),550);return}if(!timer){startAt=Date.now()-elapsed;timer=setInterval(()=>{elapsed=Date.now()-startAt;clock()},100)}b.classList.add('done');next++;$('progress').textContent=(next-1000)+' / 26';if(next>1025){stop();$('target').textContent='✓';$('status').textContent='Чудово! Усі числа знайдено за '+$('clock').textContent+'!';return}$('target').textContent=next;$('status').textContent='Правильно! Знайди число '+next+'.'}document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{variant=Number(button.dataset.choice);document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.toggle('selected',b===button);b.setAttribute('aria-pressed',String(b===button))});reset()}));$('restart').onclick=reset;$('hint').onclick=()=>{let b=document.querySelector('.cell[data-n="'+next+'"]');if(!b)return;b.classList.add('hint');$('status').textContent='Підказка: знайди підсвічену фігуру.';setTimeout(()=>b.classList.remove('hint'),1300)};reset();</script></body></html>
